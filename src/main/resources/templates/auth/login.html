<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Strain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">
<div class="container card shadow p-4" style="max-width: 500px">
    <h2 class="mb-4 text-center">Sign in</h2>

    <form th:action="@{/login}" th:object="${user}" method="post" class="gap-3 d-flex flex-column">

        <span th:if="${emailError != null}" th:text="${emailError}" class="alert alert-danger"></span>

        <th:block th:each="error : ${#fields.errors()}">
            <span th:text="${error}" class="alert alert-danger"/>
        </th:block>

        <div>
            <label class="form-label" for="email">Email</label>
            <input placeholder="Email" class="form-control" id="email" th:field="*{email}" required>
        </div>

        <div>
            <label class="form-label" for="password">Password</label>
            <input placeholder="Password" type="password" class="form-control" id="password" th:field="*{password}">
            <input type="button" class="btn" onclick="location.href='/change-password'" value="Forgot password?">
        </div>

            <div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100 rounded-4">Sign in</button>
                </div>
            </div>

        <a href="/register" class="btn btn-secondary w-100 rounded-4">
            Don't have an account yet? <span><u>Register</u></span>
        </a>
    </form>
</div>
</body>
</html>
