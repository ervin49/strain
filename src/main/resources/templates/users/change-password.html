<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Strain - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .nav-link.active {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: dodgerblue !important;
            border-radius: 8px !important;
        }
    </style>
</head>
<body>
<div class="container-fluid d-flex min-vh-100 p-0 bg-black">
    <div th:replace="~{fragments/sidebar.html :: sidebar}"></div>
    <div class="flex-grow-1 d-flex align-items-center flex-column justify-content-center p-3" >

        <div class="w-100 p-4 border-black rounded shadow" style="max-width: 500px; background-color: #161819">
            <form th:action="@{/settings/change-password}" th:object="${request}" method="POST" enctype="multipart/form-data">

                <div class="d-flex justify-content-between mb-4">
                    <input type="button" onclick="location.href='/settings'" class="btn small border" value="Back"/>
                    <button class="btn btn-primary rounded-3" style="width: 150px" type="submit">Save changes</button>
                </div>

                <div class="mb-3">
                    <strong>Change password</strong>
                </div>

                <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div>
                <div class="mb-4 text-start">
                    <label for="email" class="form-label small">Email</label>
                    <input th:field="*{oldPassword}" id="email" class="form-control rounded-3" placeholder="Email"/>
                </div>

                <div class="mb-4">
                    <label for="old-password" class="form-label small">Old password</label>
                    <input th:field="*{oldPassword}" id="old-password" class="form-control rounded-3" placeholder="Old password"/>
                </div>

                <div class="mb-4">
                    <label for="new-password" class="form-label small">New password</label>
                    <input th:field="*{newPassword}" id="new-password" class="form-control rounded-3" placeholder="New password"/>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
